name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:db
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:integration
  features:
    # Student visa, roster, time off, public holidays: migrations, both servers, rollback.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:visa
      - run: npm run test:features
      - run: npm run test:stock
      - run: npm run test:roles
      - run: npm run test:push
      - run: npm run test:recipes
      - run: npm run test:invoices
      - run: npm run test:ingredient-costs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pdf
      - run: pip install pdfplumber
      - run: python tests/e2e/check-pdf.py
      - run: python tests/e2e/check-pdf-seven.py
      - run: npm run test:e2e:v38
      - run: npm run test:e2e:stock
      - run: npm run test:e2e:roles
      - run: npm run test:e2e:recipes
      - run: npm run test:e2e:invoices
      - run: npm run test:e2e:redesign
  browser-webkit:
    # Safari's engine (what iPhones use) on Linux, with the iPhone 13 profile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npm run test:pdf:webkit
      - run: pip install pdfplumber
      - run: python tests/e2e/check-pdf.py webkit
      - run: python tests/e2e/check-pdf-seven.py webkit
      - run: npm run test:e2e:v38:webkit
      - run: npm run test:e2e:stock:webkit
      - run: npm run test:e2e:roles:webkit
      - run: npm run test:e2e:recipes:webkit
      - run: npm run test:e2e:invoices:webkit
      - run: npm run test:e2e:redesign:webkit
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:hardening
